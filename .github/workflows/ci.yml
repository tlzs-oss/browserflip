name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION: BrowserFlip.slnx
  XPLAT_SOLUTION: BrowserFlip.CrossPlatform.slnx
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # Windows is the product platform: full WPF build, the whole test suite (both target
  # frameworks of BrowserFlip.Core.Tests, including the native Windows API smoke tests)
  # and all repository-wide checks.
  # NOTE: the job name is a required status check on main - do not rename it.
  build-test:
    name: Build, test & checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build (warnings are errors)
        run: dotnet build $env:SOLUTION -c Release --no-restore

      - name: Test
        run: >
          dotnet test $env:SOLUTION -c Release --no-build
          --collect "XPlat Code Coverage"
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

      - name: Developer entry point is usable
        if: ${{ !cancelled() }}
        run: ./scripts/dev.ps1 info

      - name: Format check (whitespace + code style)
        if: ${{ !cancelled() }}
        run: |
          dotnet format whitespace $env:SOLUTION --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format style $env:SOLUTION --verify-no-changes --no-restore --severity warn --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vulnerable package check
        if: ${{ !cancelled() }}
        run: |
          $raw = dotnet list $env:SOLUTION package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { $raw | Write-Host; throw "dotnet list package --vulnerable failed ($LASTEXITCODE)" }
          $report = ($raw -join "`n") | ConvertFrom-Json
          $found = @()
          foreach ($project in @($report.projects)) {
            foreach ($fw in @($project.frameworks | Where-Object { $_ })) {
              foreach ($pkg in @($fw.topLevelPackages) + @($fw.transitivePackages) | Where-Object { $_ }) {
                foreach ($v in @($pkg.vulnerabilities | Where-Object { $_ })) {
                  $found += "$($pkg.id) $($pkg.resolvedVersion) [$($fw.framework)] severity=$($v.severity) $($v.advisoryurl)"
                }
              }
            }
          }
          if ($found.Count -gt 0) {
            $found | Sort-Object -Unique | ForEach-Object { Write-Host "::error::Vulnerable package: $_" }
            exit 1
          }
          Write-Host "No vulnerable packages found."

      - name: Dependency / License Check
        if: ${{ !cancelled() }}
        run: ./scripts/license-check.ps1 -Target $env:SOLUTION -VerifyOnline

  # macOS proves that the portable Core keeps building and passing its tests off Windows.
  # It deliberately does NOT repeat the Windows checks (format, licenses, vulnerabilities)
  # and cannot build the WPF application. A green run here is not Windows verification.
  macos-core:
    name: macOS Core build & test
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build & test the portable Core (via the developer entry point)
        run: ./scripts/dev.sh check

      # Guards the rule that Windows-native tests must never run on macOS: building the
      # net10.0-windows target here must still produce zero failures, with the native
      # smoke tests reported as skipped.
      - name: Windows-only tests are skipped, never executed
        run: |
          set -euo pipefail
          mkdir -p TestResults
          log=TestResults/windows-tfm-on-macos.log
          dotnet test "$XPLAT_SOLUTION" -c Release -f net10.0-windows --results-directory TestResults | tee "$log"
          # The default console summary reads:
          #   Passed!  - Failed: 0, Passed: 95, Skipped: 4, Total: 99
          grep -Eq 'Failed: +0,' "$log" || { echo "::error::native Windows tests must not fail on macOS"; exit 1; }
          # Each native test must appear as skipped by name, so the guard cannot be satisfied
          # by some unrelated [Fact(Skip=...)] or by the tests disappearing from the build.
          expected=$(grep -c '\[WindowsFact\]' tests/BrowserFlip.Core.Tests/Platform/WindowsNativeApiTests.cs)
          [ "$expected" -gt 0 ] || { echo "::error::no [WindowsFact] tests found to guard"; exit 1; }
          actual=$(grep -c '^  *Skipped BrowserFlip\.Core\.Tests\.WindowsNativeApiTests\.' "$log" || true)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected WindowsNativeApiTests to be skipped on macOS, saw $actual"
            exit 1
          fi
          echo "All $expected WindowsNativeApiTests were skipped, not executed."
        env:
          DOTNET_CLI_UI_LANGUAGE: en

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-macos
          path: TestResults/
          retention-days: 14
          if-no-files-found: warn

  # R2 technology prototype (Avalonia). It lives in its own solution and has its own
  # dependencies, so it is built and tested separately and can never affect the product's
  # build, its licence allowlist or its zero-third-party-dependency guarantee.
  prototype-macos:
    name: macOS Avalonia prototype
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: prototypes/avalonia
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build BrowserFlip.Prototype.slnx -c Release

      - name: Test (unit + mocked system APIs + Avalonia headless UI)
        run: >
          dotnet test tests/BrowserFlip.Prototype.Tests/BrowserFlip.Prototype.Tests.csproj
          -c Release --no-build --logger trx --results-directory TestResults

      # Proves the prototype really starts on macOS and talks to the real OS. The app renders
      # its own window to PNG, because screen capture needs a TCC grant a runner does not have.
      # It never changes the default browser: that needs --switch-default, which CI never passes.
      - name: Launch the app and run the capability self-test
        run: |
          set -euo pipefail
          ./macos/bundle.sh Release
          "artifacts/BrowserFlip Prototype.app/Contents/MacOS/BrowserFlipPrototype" --selftest "$PWD/selftest-out"
          test -s selftest-out/prototype-window.png || { echo "::error::no window was rendered"; exit 1; }

      - name: Upload prototype evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototype-evidence-macos
          path: |
            prototypes/avalonia/TestResults/
            prototypes/avalonia/selftest-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Package the .app and a .dmg
        run: |
          set -euo pipefail
          ./macos/make-dmg.sh Release
          ./macos/verify-bundle.sh | tee selftest-out/bundle-report.txt

      - name: Upload macOS package
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototype-macos-dmg
          path: prototypes/avalonia/artifacts/*.dmg
          retention-days: 14
          if-no-files-found: warn

  # Linux is verified by actually RUNNING the application against a real X11 server (Xvfb),
  # not merely by compiling it. Wayland cannot be covered this way and is not claimed.
  prototype-linux:
    name: Linux Avalonia prototype
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: prototypes/avalonia
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Xvfb is a real X server; the others are the X client libraries Avalonia's X11 backend
      # needs. Nothing here stubs the toolkit out.
      - name: Install an X11 session
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils libx11-6 libice6 libsm6 libfontconfig1

      - name: Build
        run: dotnet build BrowserFlip.Prototype.slnx -c Release

      - name: Test (unit + mocked system APIs + Avalonia headless UI)
        run: >
          dotnet test tests/BrowserFlip.Prototype.Tests/BrowserFlip.Prototype.Tests.csproj
          -c Release --no-build --logger trx --results-directory TestResults

      # Installs a browser so the detection path has something real to find. Without this the
      # runner has no .desktop web browser at all and the check would only prove "nothing found".
      - name: Install a browser to detect
        run: sudo apt-get install -y -qq firefox || sudo snap install firefox || true

      - name: Run the app on a real X11 server
        run: ./linux/run-selftest.sh "$PWD/selftest-out" Release

      - name: Upload Linux evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototype-evidence-linux
          path: |
            prototypes/avalonia/TestResults/
            prototypes/avalonia/selftest-out/
          retention-days: 14
          if-no-files-found: warn
