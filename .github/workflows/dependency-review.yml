name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Permissive licenses only. MS-PL is deliberately NOT allowed: its source-distribution
          # clause is weak copyleft; any MS-PL dependency needs an explicit maintainer decision.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
          # CI-only tooling that is never shipped or linked into BrowserFlip:
          #   trufflesecurity/trufflehog (AGPL-3.0) runs as a container in secret-scan.yml.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog
          # The fork-safe default; no PR comment (needs pull-requests: write).
          comment-summary-in-pr: never
